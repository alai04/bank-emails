[project]
name = "bank-emails"
version = "0.2.0"
description = "Microsoft 365 mail confirmation processing daemon"
readme = "README.md"
authors = [
    { name = "alai04", email = "alai04@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "O365>=2.1.9,<3",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
bank-emails = "bank_emails:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
